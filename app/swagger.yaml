  /api/cruint/medical-records/link:
    post:
      tags:
        - cruint
      summary: 'Link Medical Record - Connect Provisional ID to Official Medical Profile - MOB-PROF-02'
      description: "Connects a provisional mobile account to an existing official medical profile in the clinic system.\n     *                  Supports two connection methods:\n     *                  1. Connect by Patient ID (pubpid) - Direct connection using official\n     *                  2. Connect by ID Number - Match using government ID (country_of_origin, id_type, id_number)\n     *\n     *                  Process flow:\n     *                  - Validates target patient exists and is active\n     *                  - Merges provisional patient data into official profile\n     *                  - Transfers patient_access_onsite credentials\n     *                  - Generates barcode for official profile\n     *                  - Sends OTP verification email\n     *                  - Soft-deletes provisional patient record"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - source_pubpid
                - fname
                - lname
                - email
                - DOB
                - sex
              properties:
                source_pubpid:
                  description: 'Source provisional patient ID (PROV-ID format) to be merged'
                  type: string
                  example: PROV-2026-00123-4
                fname:
                  description: 'Patient first name for verification'
                  type: string
                  example: John
                lname:
                  description: 'Patient last name for verification'
                  type: string
                  example: Doe
                email:
                  description: 'Patient email address for OTP verification'
                  type: string
                  format: email
                  example: john.doe@example.com
                DOB:
                  description: 'Date of birth (YYYY-MM-DD) for verification'
                  type: string
                  format: date
                  example: '1990-01-15'
                sex:
                  description: 'Sex at birth for verification'
                  type: string
                  enum: [Male, Female]
                  example: Male
                pubpid:
                  description: 'Target official Patient ID. Required for Case 1: Connect by Patient ID. Omit for Case 2: Connect by ID Number.'
                  type: string
                  example: CRUHU011579
                country_of_origin:
                  description: 'Country of origin. Required for Case 2: Connect by ID Number. Omit for Case 1: Connect by Patient ID.'
                  type: string
                  example: Vietnam
                id_type:
                  description: 'Government ID type. Required for Case 2: Connect by ID Number. Omit for Case 1: Connect by Patient ID.'
                  type: string
                  enum: [Passport, 'National ID', 'Driver License']
                  example: Passport
                id_number:
                  description: 'Government ID number. Required for Case 2: Connect by ID Number. Omit for Case 1: Connect by Patient ID.'
                  type: string
                  example: N1234567
              type: object
      responses:
        '200':
          description: 'Success - Medical profile connected successfully'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '200' }
                  message: { type: string, example: 'Medical profile connected.' }
                  data: { description: 'Connection result data', type: object }
                  message_id: { type: array, items: { type: string }, example: [medical_success_1] }
                type: object
        '400':
          description: 'Bad Request - Missing required fields or invalid search criteria'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '400' }
                  message: { type: string, example: 'Missing search criteria' }
                  message_id: { type: array, items: { type: string }, example: [common_error_01] }
                  data: { type: object, example: [] }
                type: object
        '404':
          description: 'Not Found - Target patient not found, multiple matches, patient inactive, or already merged'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '404' }
                  message: { description: "Possible messages: 'Patient not found' (patient_error_1), 'Multiple patients found' (medical_error_2), 'Patient is inactive' (medical_error_1), 'Patient already merged' (medical_error_3)", type: string, example: 'Patient not found' }
                  message_id: { description: 'Error message IDs: patient_error_1, medical_error_1, medical_error_2, medical_error_3', type: array, items: { type: string }, example: [patient_error_1] }
                  data: { type: object, example: [] }
                type: object
        '500':
          description: 'Internal Server Error - Failed to connect medical profile'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '500' }
                  message: { type: string, example: 'Failed to connect medical profile' }
                  message_id: { type: array, items: { type: string }, example: [common_error_07] }
                  data: { type: object, example: [] }
                type: object
      security:
        -
          bearer_token: []
