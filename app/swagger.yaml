          required: false
          schema:
            type: string
        -
          name: phone_cell
          in: query
          description: 'The cell phone for the patient.'
          required: false
          schema:
            type: string
        -
          name: postal_contact
          in: query
          description: 'The postal_contact for the patient.'
          required: false
          schema:
            type: string
        -
          name: sex
          in: query
          description: 'The gender for the patient.'
          required: false
          schema:
            type: string
        -
          name: country_code
          in: query
          description: 'The country code for the patient.'
          required: false
          schema:
            type: string
        -
          name: email
          in: query
          description: 'The email for the patient.'
          required: false
          schema:
            type: string
        -
          name: DOB
          in: query
          description: 'The DOB for the patient.'
          required: false
          schema:
            type: string
        -
          name: date
          in: query
          description: 'The date this patient resource was last modified.'
          required: false
          schema:
            type: string
        -
          name: _offset
          in: query
          description: 'The number of records to offset from this index in the search result.'
          required: false
          schema:
            type: integer
        -
          name: _limit
          in: query
          description: 'The maximum number of resources to return in the result set. 0 means unlimited.'
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 0
      responses:
        '200':
          $ref: '#/components/responses/standard'
        '400':
          $ref: '#/components/responses/badrequest'
        '401':
          $ref: '#/components/responses/unauthorized'
      security:
        -
          openemr_auth: []
    post:
      tags:
        - standard
      description: 'Creates a new patient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api_patient_request'
      responses:
        '200':
          description: 'Standard response'
          content:
            application/json:
              schema:
                properties:
                  validationErrors: { description: 'Validation errors.', type: array, items: { type: object } }
                  internalErrors: { description: 'Internal errors.', type: array, items: { type: object } }
                  data: { description: 'Returned data.', type: array, items: { properties: { pid: { description: 'patient pid', type: integer } }, type: object } }
                type: object
                example:
                  validationErrors: []
                  error_description: []
                  data: { pid: 1 }
        '401':
          $ref: '#/components/responses/unauthorized'
      security:
        -
          openemr_auth: []
  /api/patient/screening-booth:
    get:
      tags:
        - patient
      summary: 'List patients for screening booth with filters'
      parameters:
