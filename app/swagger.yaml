  /api/cruint/appointment/clinicians:
    get:
      tags:
        - cruint
      summary: 'Get list of clinicians (providers)'
      description: "Returns a list of active clinicians/providers available for appointment scheduling.\n     *                  Clinicians must have authorized != 0, active = 1, and calendar = 1 in EHR.\n     *                  Supports optional search filtering (MOB-APT-01 AC3.1, AC3.2).\n     *                  Results are sorted in chronological order (oldest to newest by ID) per AC3.1 spec.\n     *                  SUPPORTS AF1 TIME-FIRST FILTERING: If date and time parameters are provided, filters to show only clinicians available at that specific time slot."
      parameters:
        -
          name: search
          in: query
          description: 'Optional search term to filter clinicians by first name, last name, or full name'
          required: false
          schema:
            type: string
            maxLength: 100
            example: Smith
        -
          name: facility_id
          in: query
          description: 'Optional facility ID to filter clinicians by their assigned facility'
          required: false
          schema:
            type: integer
            example: 1
        -
          name: date
          in: query
          description: "Optional date for AF1 time-first filtering (YYYY-MM-DD format). Must be used with 'time' parameter to filter available clinicians at specified time slot (MOB-APT-01 AF1)."
          required: false
          schema:
            type: string
            format: date
            example: '2026-01-20'
        -
          name: time
          in: query
          description: "Optional time for AF1 time-first filtering (HH:MM 24-hour format). Must be used with 'date' parameter. When both provided, returns only clinicians available at that time slot (MOB-APT-01 AF1: filters clinicians based on selected time slot before clinician selection)."
          required: false
          schema:
            type: string
            example: '10:00'
      responses:
        '200':
          description: 'List of clinicians retrieved successfully (filtered by availability if date+time provided)'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '200' }
                  message: { type: string, example: 'Clinicians retrieved successfully' }
                  data: { description: 'Array of clinician objects sorted by id ASC (chronological order per AC3.1)', type: array, items: { properties: { id: { description: 'Clinician user ID', type: integer, example: 5 }, username: { description: Username, type: string, example: drsmith }, first_name: { description: 'First name', type: string, example: John }, last_name: { description: 'Last name', type: string, example: Smith }, display_name: { description: "Formatted display name (AC3.1 format: 'Dr [First Name] [Last Name]')", type: string, example: 'Dr John Smith' } }, type: object } }
                type: object
        '400':
          description: 'Bad Request - Invalid parameters'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '400' }
                  message: { type: string, example: 'Invalid facility_id parameter' }
                  message_id: { type: array, items: { type: string }, example: [appointment_error_10] }
                  data: { type: object, example: [] }
                type: object
  /api/cruint/appointment/slots:
    get:
      tags:
        - cruint
      summary: 'Get available time slots for appointment booking'
      description: "Returns list of available time slots based on date, clinician, and department. Logic aligns with Web Calendar working hours (08:00-17:45) with 30-minute slot intervals. Implements MOB-APT-01 AC4 requirements: displays all department slots if no clinician selected, or only selected clinician's slots if specified. Excludes elapsed/booked slots and past dates."
      parameters:
        -
          name: date
          in: query
          description: 'Date for which to fetch slots (YYYY-MM-DD format). Must be today or future date. Past dates are rejected.'
          required: true
          schema:
            type: string
            format: date
            example: '2025-12-15'
        -
          name: department_id
          in: query
          description: 'Department/Facility ID to fetch slots for (MOB-APT-01 AC4 requirement)'
          required: true
          schema:
            type: integer
            example: 1
        -
          name: clinician_id
          in: query
          description: "Optional clinician ID to filter slots. If null/omitted, returns slots for all clinicians in department (AC4: 'no preferred clinician selected'). If provided, returns only that clinician's available slots (AC4: 'specific clinician selected')."
          required: false
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: 'Success - List of available slots (AC4.1 requirement)'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '200' }
                  message: { type: string, example: 'Available slots retrieved successfully' }
                  data: { description: 'Array of available time slot objects', type: array, items: { properties: { time: { description: 'Slot start time (HH:MM 24-hour format)', type: string, example: '09:15' }, display_time: { description: 'Slot start time (12-hour format with AM/PM)', type: string, example: '09:15 AM' }, timestamp: { description: 'Unix timestamp for slot start time', type: integer, example: 1678886100 } }, type: object } }
                type: object
        '400':
          description: 'Bad Request - Invalid parameters or validation failure (AC4.1: past dates validation)'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '400' }
                  message: { type: string, example: 'Invalid date format. Expected format: YYYY-MM-DD' }
                  message_id: { type: array, items: { type: string }, example: [appointment_error_04] }
                  data: { type: object, example: [] }
                type: object
        '500':
          description: 'Internal Server Error - Failed to retrieve slots'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '500' }
                  message: { type: string, example: 'Failed to retrieve slots' }
                  message_id: { type: array, items: { type: string }, example: [common_error_07] }
                  data: { type: object, example: [] }
                type: object
      security:
        -
          bearer_token: []
  '/api/cruint/department/{department_id}/monthly-availability':
    get:
      tags:
        - cruint
      summary: 'Get monthly availability calendar for a department'
      description: "Returns calendar view of a month showing which dates have available appointment slots.\n     *                  Simple response format useful for FE calendar rendering - check hasSlots flag for each date to show availability.\n     *                  Supports optional clinician filtering to check only a specific provider's availability.\n     *                  Cannot query past months or more than 12 months ahead."
      parameters:
        -
          name: department_id
          in: path
          description: 'Department/Facility ID to check availability for'
          required: true
          schema:
            type: integer
            example: 1
        -
          name: year
          in: query
          description: 'Year for availability check (YYYY format). Defaults to current year if not provided.'
          required: false
          schema:
            type: integer
            example: 2026
        -
          name: month
          in: query
          description: 'Month for availability check (1-12). Defaults to current month if not provided.'
          required: false
          schema:
            type: integer
            maximum: 12
            minimum: 1
            example: 2
        -
          name: clinician_id
          in: query
          description: 'Optional clinician ID to filter slots by specific provider. If omitted, checks department-wide availability.'
          required: false
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: 'Success - Monthly availability calendar retrieved'
          content:
            application/json:
