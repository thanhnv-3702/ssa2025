  '/api/cruint/appointments/{eid}/action':
    post:
      tags:
        - cruint
      summary: 'Cancel or Reschedule an appointment (MOB-APT-03)'
      description: "Handles appointment modification actions for mobile patients. Supports two action types: CANCEL and RESCHEDULE. Implements ownership verification, status conflict validation (AF2), and late cancellation policy (AF1). Returns 403 if patient doesn't own appointment, 409 if already checked-in or slot unavailable."
      parameters:
        -
          name: eid
          in: path
          description: 'Appointment ID to modify'
          required: true
          schema:
            type: integer
            example: 123
      requestBody:
        description: 'Action payload for Cancel or Reschedule'
        required: true
        content:
          application/json:
            schema:
              required:
                - action_type
              properties:
                action_type:
                  description: 'Type of action to perform'
                  type: string
                  enum: [CANCEL, RESCHEDULE]
                  example: CANCEL
                cancel_reason:
                  description: 'Required if action_type is CANCEL. Reason for cancellation (AC2)'
                  type: string
                  enum: ['Schedule Conflict', Recovered, 'No Longer Needed', Other]
                  example: 'Schedule Conflict'
                policy_ack:
                  description: 'Set to true if user acknowledged late cancellation warning (AF1). Required on second request if warning returned.'
                  type: boolean
                  example: false
                new_date:
                  description: 'Required if action_type is RESCHEDULE. New appointment date (YYYY-MM-DD)'
                  type: string
                  format: date
                  example: '2026-01-25'
                new_start_time:
                  description: 'Required if action_type is RESCHEDULE. New start time in 24-hour format (HH:MM)'
                  type: string
                  example: '14:00'
                clinician_id:
                  description: 'Optional for RESCHEDULE. If omitted, keeps original clinician'
                  type: integer
                  example: 5
                visit_type:
                  description: 'Optional for RESCHEDULE. Defaults to original if omitted'
                  type: string
                  enum: [screening, control-visit]
                  example: control-visit
                department_id:
                  description: 'Optional for RESCHEDULE. Defaults to original facility if omitted'
                  type: integer
                  example: 1
                category_id:
                  description: 'Optional for RESCHEDULE. Defaults to original category if omitted'
                  type: integer
                  example: 9
              type: object
      responses:
        '200':
          description: 'Success - Action completed or warning returned'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '200' }
                  message: { type: string, example: 'Appointment cancelled successfully' }
                  data: { type: object, oneOf: [{ description: 'Cancel Success', properties: { appointment_id: { type: integer, example: 123 } }, type: object }, { description: 'Reschedule Success', properties: { old_appt_id: { type: integer, example: 123 }, new_appt_id: { type: integer, example: 124 }, new_appt_uuid: { type: string, example: a1b2c3d4-... } }, type: object }, { description: 'Late Cancellation Warning (AF1)', properties: { warning: { type: string, example: late_cancellation }, hours_until_appointment: { type: number, example: 12.5 }, requires_acknowledgment: { type: boolean, example: true } }, type: object }] }
                type: object
        '400':
          description: 'Bad Request - Missing parameters or invalid action type'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '400' }
                  message: { type: string, example: 'Invalid action_type. Must be CANCEL or RESCHEDULE' }
                  message_id: { type: array, items: { type: string }, example: [appointment_error_16] }
                  data: { type: object, example: [] }
                type: object
        '401':
          description: 'Unauthorized - Invalid or missing JWT token'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '401' }
                  message: { type: string, example: 'Unauthorized patient' }
                  message_id: { type: array, items: { type: string }, example: [common_error_05] }
                  data: { type: object, example: [] }
                type: object
        '403':
          description: 'Forbidden - Appointment does not belong to authenticated patient'
