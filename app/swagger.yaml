          name: facility_id
          in: query
          description: 'Facility ID (required)'
          required: true
          schema:
            type: integer
        -
          name: keyword
          in: query
          description: 'Search keyword (lname,fname,mname,pubpid)'
          required: false
          schema:
            type: string
        -
          name: date
          in: query
          description: 'Filter by date (YYYY-MM-DD)'
          required: false
          schema:
            type: string
            format: date
        -
          name: arrivalStatus
          in: query
          description: 'Arrival status'
          required: false
          schema:
            type: integer
        -
          name: sessionStatus
          in: query
          description: 'Session status'
          required: false
          schema:
            type: integer
        -
          name: DOB
          in: query
          description: 'Date of birth (YYYY-MM-DD)'
          required: false
          schema:
            type: string
            format: date
        -
          name: sex
          in: query
          description: Sex
          required: false
          schema:
            type: string
        -
          name: _offset
          in: query
          description: 'Zero-based offset'
          required: false
          schema:
            type: integer
            minimum: 0
        -
          name: _count
          in: query
          description: 'Page size (0..200)'
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 0
        -
          name: page
          in: query
          description: '1-based page index (alternative to _offset)'
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: pageSize
          in: query
          description: 'Page size (alternative to _count)'
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 1
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/badrequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          description: 'User does not have access to the specified facility'
      security:
        -
          openemr_auth: []
  '/api/patient/{puuid}':
