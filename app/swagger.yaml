          name: limit
          in: query
          description: 'Items per page (1-100, default: 10)'
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            example: 10
        -
          name: filter
          in: query
          description: 'Preset date filter. Options: last_30_days (visits from last 30 days), last_60_days (visits from last 60 days), last_6_months (visits from last 6 months). Note: Custom date parameters (date_from/date_to) override this filter.'
