              properties:
                facility_id:
                  description: 'The ID of the facility to switch to.'
                  type: integer
              type: object
              example:
                facility_id: 1
      responses:
        '200':
          description: 'Facility switched successfully'
        '400':
          $ref: '#/components/responses/badrequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          description: 'Not authorized to access this facility'
      security:
        -
          openemr_auth: []
  /api/patient:
