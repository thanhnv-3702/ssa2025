              schema:
                properties:
                  code: { type: string, example: '404' }
                  message: { type: string, example: 'Appointment not found' }
                  message_id: { type: array, items: { type: string }, example: [appointment_error_01] }
                  data: { type: object, example: [] }
                type: object
        '409':
          description: 'Conflict - Check-in already occurred (AF2) or slot unavailable'
          content:
            application/json:
              schema:
                properties:
                  code: { type: string, example: '409' }
                  message: { type: string, example: 'This appointment cannot be modified as check-in has already occurred. Please contact the receptionist.' }
