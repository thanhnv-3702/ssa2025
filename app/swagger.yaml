                  type: object
            type: object
            example:
              validationErrors: []
              error_description: []
              data: []
    badrequest:
      description: 'Bad Request'
      content:
        application/json:
          schema:
            properties:
              validationErrors:
                description: 'Validation errors.'
                type: object
            type: object
            example:
              validationErrors:
                _id: 'The search field argument was invalid, improperly formatted, or could not be parsed.  Inner message: UUID columns must be a valid UUID string'
    unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
