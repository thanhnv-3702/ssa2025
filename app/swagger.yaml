openapi: 3.0.0
info:
  title: 'OpenEMR API'
  version: 7.0.4
servers:
  -
    url: /apis/default/
paths:
  /api/login:
    post:
      tags:
        - auth
      description: 'Mobile app login - authenticate with username/password and receive API token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - username
                - password
              properties:
                username:
                  description: 'Username or patient portal username'
                  type: string
                password:
                  description: 'User password'
                  type: string
                user_role:
                  description: 'User role (default: patient)'
                  type: string
                  enum: [user, patient]
                email:
                  description: 'Optional email for patient login if enforce_signin_email is enabled'
                  type: string
              type: object
      responses:
        '200':
          description: 'Login successful, returns access token'
          content:
            application/json:
              schema:
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 86400 }
                  user_id: { type: string }
                  user_role: { type: string, enum: [user, patient] }
                  username: { type: string }
                type: object
        '400':
          $ref: '#/components/responses/badrequest'
        '401':
          $ref: '#/components/responses/unauthorized'
  /api/logout:
    post:
      tags:
        - auth
      description: 'Logout and revoke the current API token'
      responses:
        '200':
          description: 'Logout successful'
        '401':
          $ref: '#/components/responses/unauthorized'
      security:
        -
          bearer_token: []
  /api/refresh-token:
    post:
      tags:
        - auth
      description: 'Refresh access token using refresh token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - refresh_token
              properties:
                refresh_token:
                  description: 'The refresh token'
                  type: string
              type: object
      responses:
        '200':
          description: 'Token refreshed successfully'
          content:
            application/json:
              schema:
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer }
                  refresh_expires_in: { type: integer }
                type: object
        '400':
          description: 'Bad request - missing refresh token'
        '401':
          description: 'Invalid or expired refresh token'
  /api/me:
    get:
      tags:
        - auth
      description: 'Get current logged-in user information'
      responses:
        '200':
          description: 'Current user information'
          content:
            application/json:
              schema:
                properties:
                  user_id: { type: string }
                  user_role: { type: string }
                  username: { type: string }
                  email: { type: string }
                type: object
        '401':
          $ref: '#/components/responses/unauthorized'
      security:
        -
          bearer_token: []
  /api/facility:
    get:
      tags:
        - standard
      description: 'Returns a single facility.'
      parameters:
        -
          name: name
          in: query
          description: 'The name for the facility.'
          required: false
          schema:
            type: string
        -
          name: facility_npi
          in: query
          description: 'The facility_npi for the facility.'
          required: false
          schema:
            type: string
        -
          name: phone
          in: query
          description: 'The phone for the facility.'
          required: false
          schema:
            type: string
        -
          name: fax
          in: query
          description: 'The fax for the facility.'
          required: false
          schema:
            type: string
        -
          name: street
          in: query
          description: 'The street for the facility.'
          required: false
          schema:
            type: string
        -
          name: city
          in: query
          description: 'The city for the facility.'
          required: false
          schema:
            type: string
        -
          name: state
          in: query
          description: 'The state for the facility.'
          required: false
          schema:
            type: string
        -
          name: postal_code
          in: query
          description: 'The postal_code for the facility.'
          required: false
          schema:
            type: string
        -
          name: country_code
          in: query
          description: 'The country_code for the facility.'
          required: false
          schema:
            type: string
        -
          name: federal_ein
          in: query
          description: 'The federal_ein for the facility.'
          required: false
          schema:
            type: string
        -
          name: website
          in: query
          description: 'The website for the facility.'
          required: false
          schema:
            type: string
        -
          name: email
          in: query
          description: 'The email for the facility.'
          required: false
          schema:
            type: string
        -
          name: domain_identifier
          in: query
          description: 'The domain_identifier for the facility.'
          required: false
          schema:
            type: string
        -
          name: facility_taxonomy
          in: query
          description: 'The facility_taxonomy for the facility.'
          required: false
          schema:
            type: string
        -
          name: facility_code
          in: query
          description: 'The facility_code for the facility.'
          required: false
          schema:
            type: string
        -
          name: billing_location
          in: query
          description: 'The billing_location setting for the facility.'
          required: false
          schema:
            type: string
        -
          name: accepts_assignment
          in: query
          description: 'The accepts_assignment setting for the facility.'
          required: false
          schema:
            type: string
        -
          name: oid
          in: query
          description: 'The oid for the facility.'
          required: false
          schema:
            type: string
        -
          name: service_location
          in: query
          description: 'The service_location setting for the facility.'
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/standard'
        '400':
          $ref: '#/components/responses/badrequest'
        '401':
          $ref: '#/components/responses/unauthorized'
      security:
        -
          openemr_auth: []
  /api/facility/authorized:
    get:
      tags:
        - standard
      description: 'Get the list of facilities that the current user is authorized to access.'
      responses:
        '200':
          description: 'List of authorized facilities and active facility ID'
        '401':
          $ref: '#/components/responses/unauthorized'
      security:
        -
          openemr_auth: []
  /api/facility/active-facilities:
    get:
      tags:
        - standard
      description: 'Get all active facilities that are service locations. This is a public endpoint.'
      responses:
        '200':
