  /api/cruint/health:
    get:
      tags:
        - cruint
      summary: 'Health check endpoint'
      description: 'Simple health check that returns 200 if the API is running. No authentication required.'
      responses:
        '200':
          description: 'API is operational'
          content:
            application/json:
              schema:
                properties:
                  health: { type: string, example: ok }
                  timestamp: { type: integer, example: 1234567890 }
                  message: { type: string, example: 'Cruint API is operational' }
                type: object
      security: []
  /api/change-password:
    post:
      tags:
        - cruint
        - auth
      description: 'Change user password with security validation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - current_password
                - new_password
                - confirm_password
              properties:
                current_password:
                  description: 'Current password'
                  type: string
                  format: password
                new_password:
                  description: 'New password (8+ chars, 1 uppercase, 1 number, 1 special char)'
                  type: string
                  format: password
                confirm_password:
                  description: 'Confirm new password'
                  type: string
                  format: password
              type: object
      responses:
        '200':
          description: 'Password changed successfully'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Password changed successfully. All other sessions have been logged out for security.' }
                type: object
        '400':
          description: 'Validation error - weak password, password mismatch, or incorrect current password'
          content:
            application/json:
              schema:
                properties:
                  errors: { type: array, items: { type: string } }
                type: object
        '401':
          description: 'Invalid or expired token'
      security:
        -
          bearer_token: []
  /api/cruint/auth/register/email:
    post:
      tags:
        - cruint
        - registration
      summary: 'Request OTP via email for user registration'
      description: 'API1: Validates email format, checks if email exists, generates 6-digit OTP with 5-minute expiry, and sends OTP via email (MOB-SEC-01)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
              properties:
                email:
                  description: "User's email address for registration"
                  type: string
                  format: email
                  example: user@example.com
              type: object
      responses:
        '200':
          description: 'OTP sent successfully'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'OTP has been sent to your email address. Please check your inbox.' }
                  expires_in: { description: 'OTP expiry time in seconds', type: integer, example: 300 }
                type: object
        '400':
          description: 'Validation error - Invalid email or email already exists'
          content:
            application/json:
              schema:
                properties:
                  validationErrors: { properties: { email: { type: string, example: 'Email address is already registered' } }, type: object }
                type: object
        '500':
          description: 'Internal Server Error - Failed to generate or send OTP'
      security: []
  /api/cruint/auth/register/verify-otp:
    post:
      tags:
        - cruint
        - registration
      summary: 'Verify OTP code and create verified user'
      description: "API2: Verifies the 6-digit OTP code. Returns 'Invalid or expired code. Please try again' for incorrect/expired codes. Creates verified user on success (MOB-SEC-01)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - otp_code
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                otp_code:
                  description: '6-digit OTP code from email'
                  type: string
                  example: '123456'
              type: object
      responses:
        '200':
          description: 'OTP verified successfully, user created'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Email verified successfully' }
                  data: { properties: { user_id: { type: integer, example: 123 }, email: { type: string, example: user@example.com }, status: { type: string, example: verified } }, type: object }
                type: object
        '400':
          description: 'Validation error - Invalid or expired OTP'
          content:
            application/json:
              schema:
                properties:
                  validationErrors: { properties: { otp_code: { type: string, example: 'Invalid or expired code. Please try again.' } }, type: object }
                type: object
      security: []
  /api/cruint/auth/register/resend-otp:
    post:
      tags:
        - cruint
        - registration
      summary: 'Resend OTP with rate limiting'
      description: 'API3: Generates new 6-digit OTP and resets 5-minute timer. Rate limited to maximum 3 attempts per 10 minutes per email (MOB-SEC-01)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
              type: object
      responses:
        '200':
          description: 'New OTP sent successfully'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'A new OTP has been sent to your email address' }
                  expires_in: { description: 'OTP expiry time in seconds', type: integer, example: 300 }
                type: object
        '400':
          description: 'Rate limit exceeded or email already registered'
          content:
            application/json:
              schema:
                properties:
                  validationErrors: { properties: { error: { type: string, example: 'Too many resend attempts. Please wait 10 minutes before trying again.' } }, type: object }
                type: object
      security: []
  /api/cruint/auth/register/password:
    post:
      tags:
        - cruint
        - registration
      summary: 'Set password for verified user'
      description: 'API4: Sets password for user who has completed email verification. Password validation will be implemented based on security requirements (MOB-SEC-01)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
                - confirm_password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  description: 'New password'
                  type: string
                  format: password
                  example: SecurePass123!
                confirm_password:
                  description: 'Password confirmation'
                  type: string
                  format: password
                  example: SecurePass123!
              type: object
      responses:
        '200':
          description: 'Password set successfully'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Password set successfully' }
                  data: { properties: { user_id: { type: integer, example: 123 }, email: { type: string, example: user@example.com } }, type: object }
                type: object
        '400':
          description: 'Validation error - Password mismatch or user not found'
          content:
            application/json:
              schema:
                properties:
                  validationErrors: { properties: { confirm_password: { type: string, example: 'Passwords do not match' } }, type: object }
                type: object
      security:
        -
          bearer_token: []
  /api/cruint/auth/register/profile:
    post:
      tags:
        - cruint
        - registration
      summary: 'Update user profile and complete registration'
      description: 'API5: Updates user profile information and completes the registration process. All profile fields are required. Detailed validation will be implemented based on business requirements (MOB-SEC-01)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - first_name
                - last_name
                - title
                - dob
                - mobile_phone
                - sex_at_birth
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                first_name:
                  description: "User's first name"
                  type: string
                  example: John
                last_name:
                  description: "User's last name"
                  type: string
                  example: Doe
                title:
                  description: "User's title/salutation"
                  type: string
                  example: Mr
                dob:
                  description: 'Date of birth (YYYY-MM-DD)'
                  type: string
                  format: date
                  example: '1990-01-01'
                mobile_phone:
                  description: 'Mobile phone number'
                  type: string
                  example: '+1234567890'
                sex_at_birth:
                  description: 'Sex at birth'
                  type: string
                  example: Male
              type: object
      responses:
        '200':
          description: 'Profile updated successfully, registration completed'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Profile updated successfully. Registration completed.' }
                  data: { properties: { user_id: { type: integer, example: 123 }, email: { type: string, example: user@example.com }, first_name: { type: string, example: John }, last_name: { type: string, example: Doe }, title: { type: string, example: Mr }, dob: { type: string, example: '1990-01-01' }, mobile_phone: { type: string, example: '+1234567890' }, sex_at_birth: { type: string, example: Male } }, type: object }
                type: object
        '400':
          description: 'Validation error - Missing required fields or user not found'
          content:
            application/json:
              schema:
                properties:
                  validationErrors: { properties: { first_name: { type: string, example: 'First name is required' } }, type: object }
                type: object
      security:
        -
          bearer_token: []
  /api/cruint/auth/forgot-password/email:
    post:
      tags:
        - cruint
        - auth
        - forgot-password
      summary: 'Request password reset OTP via email'
      description: "API1: Sends an OTP code to the user's email for password reset. Returns success even if email doesn't exist to prevent email enumeration attacks."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
              properties:
                email:
                  description: 'Registered email address'
                  type: string
                  format: email
                  example: user@example.com
              type: object
      responses:
        '200':
          description: "OTP sent successfully (or email doesn't exist - same response for security)"
          content:
            application/json:
              schema:
                properties:
                  validationErrors: { type: array, items: { type: string } }
                  internalErrors: { type: array, items: { type: string } }
                  error: { type: string, example: '' }
                  data: { properties: { expires_in: { description: 'OTP expiry in seconds', type: integer, example: 300 } }, type: object }
                type: object
        '400':
          description: 'Validation error'
          content:
            application/json:
              schema:
                properties:
                  validationErrors: { type: array, items: { type: string, example: forgot_password_email_error_01 } }
                  error: { type: string, example: 'Email is required.' }
                type: object
      security: []
  /api/cruint/auth/forgot-password/verify-otp:
    post:
      tags:
        - cruint
        - auth
        - forgot-password
      summary: 'Verify password reset OTP code'
      description: 'API2: Verifies the OTP code sent via email and returns a reset token for password change.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - otp_code
              properties:
                email:
                  description: 'Email address'
                  type: string
                  format: email
                  example: user@example.com
                otp_code:
                  description: '6-digit OTP code'
                  type: string
                  example: '123456'
              type: object
      responses:
        '200':
          description: 'OTP verified successfully'
          content:
            application/json:
              schema:
                properties:
                  validationErrors: { type: array, items: { type: string } }
