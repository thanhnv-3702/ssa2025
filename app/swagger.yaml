          description: 'The patient id (pid)'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                current_patient_step:
                  description: 'Current step in the patient session'
                  type: string
                  maxLength: 100
                start_time:
                  description: 'Session start time (ISO 8601 format)'
                  type: string
                  format: date-time
                completion_time:
                  description: 'Session completion time (ISO 8601 format)'
                  type: string
                  format: date-time
                failure_reason:
                  description: 'Reason for session failure, if any'
                  type: string
                  maxLength: 255
                character_selection:
                  description: 'Selected character type or avatar'
                  type: string
                  maxLength: 50
                language_selection:
                  description: 'Selected language for the session'
                  type: string
                  maxLength: 50
              type: object
              example:
                current_patient_step: questionnaire
                start_time: '2025-10-28T09:00:00Z'
                completion_time: '2025-10-28T09:45:00Z'
                failure_reason: null
                character_selection: female_doctor
                language_selection: en
      responses:
        '200':
          description: 'Session detail updated successfully'
        '400':
          description: 'Invalid input or update failed'
