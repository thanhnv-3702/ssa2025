<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hungary TAJ Validator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 420px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #f5f5f5;
    }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
    input {
      width: 100%;
      padding: 0.6rem;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #result {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    #result.valid { background: #dcfce7; color: #166534; }
    #result.invalid { background: #fef3c7; color: #92400e; }
    #result.error { background: #fee2e2; color: #991b1b; }
    #result:empty { display: none; }
  </style>
</head>
<body>
  <h1>Hungary TAJ Validator</h1>
  <label for="taj">TAJ number (9 digits)</label>
  <input id="taj" type="text" inputmode="numeric" maxlength="9" placeholder="e.g. 088376674" autocomplete="off">
  <button type="button" id="validate">Validate</button>
  <div id="result"></div>

  <script>
    const TAJ_LENGTH = 9;
    const TAJ_WEIGHTS = [3, 7, 1, 3, 7, 1, 3, 7];

    function validateHungaryTaj(taj) {
      const s = String(taj).trim();
      if (s.length !== TAJ_LENGTH || !/^\d+$/.test(s)) {
        return { valid: false, corrected_taj: null };
      }

      let totalSum = 0;
      const idDigitsCount = TAJ_LENGTH - 1;

      for (let i = 0; i < idDigitsCount; i++) {
        totalSum += parseInt(s[i], 10) * TAJ_WEIGHTS[i];
      }

      const calculatedCheckDigit = totalSum % 10;
      const providedCheckDigit = parseInt(s[idDigitsCount], 10);

      if (calculatedCheckDigit !== providedCheckDigit) {
        const correctedTaj = s.slice(0, 8) + String(calculatedCheckDigit);
        return { valid: false, corrected_taj: correctedTaj };
      }

      return { valid: true, corrected_taj: null };
    }

    const input = document.getElementById('taj');
    const resultEl = document.getElementById('result');
    const btn = document.getElementById('validate');

    function showResult() {
      const taj = input.value.trim();
      resultEl.className = '';
      resultEl.textContent = '';

      if (!taj) {
        resultEl.className = 'error';
        resultEl.textContent = 'Please enter a TAJ number.';
        return;
      }

      const r = validateHungaryTaj(taj);

      if (r.valid) {
        resultEl.className = 'valid';
        resultEl.textContent = 'Valid TAJ number.';
      } else if (r.corrected_taj) {
        resultEl.className = 'invalid';
        resultEl.textContent = 'Invalid. Correct check digit: ' + r.corrected_taj;
      } else {
        resultEl.className = 'error';
        resultEl.textContent = 'Invalid: must be exactly 9 digits.';
      }
    }

    btn.addEventListener('click', showResult);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') showResult();
    });
    input.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, TAJ_LENGTH);
    });
  </script>
</body>
</html>
