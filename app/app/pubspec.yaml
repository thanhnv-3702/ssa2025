name: saa2025
description: SAA 2025 — Sun* Annual Awards mobile app (iOS).
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  permission_handler: ^12.0.1
  http2: ^2.3.1
  pdfx: ^2.9.2
  country_codes: ^3.3.0
  flutter_timezone: ^4.1.1
  android_intent_plus: ^6.0.0
  email_validator: ^3.0.0
  url_launcher: ^6.3.2
  image_gallery_saver:
    path: ../plugins/image_gallery_saver
  gap: ^3.0.1
  flutter_inappwebview: ^6.0.0
  pinput: ^6.0.1
  share_plus: ^10.1.4
  flutter_easyloading: ^3.0.5
  get_it: ^8.2.0
  pull_to_refresh:
    path: ../plugins/pull_to_refresh-2.0.0
  rxdart: ^0.28.0
  event_bus: ^2.0.1
  flutter_svg: ^2.2.1
  intl: 0.20.2
  device_info_plus: ^10.0.1
  flutter_screenutil: ^5.9.2
  equatable: ^2.0.7
  injectable: ^2.5.1
  json_annotation: ^4.9.0
  auto_route: ^9.0.0
  youtube_explode_dart: ^2.5.2
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.5
  bot_toast: ^4.1.3
  lottie: ^3.3.1
  add_2_calendar: ^3.0.1
  flutter_cache_manager: ^3.3.0
  cached_network_image: ^3.3.0
  permission_handler_platform_interface: ^4.3.0
  fluro: ^2.0.5
  floor: ^1.5.0
  dio: ^5.4.1
  retrofit: ^4.2.0
  logger: ^2.6.1
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.0.0
  barcode_widget: ^2.0.0
  screen_brightness: ^0.2.2+1
  package_info_plus: ^8.0.0
  open_filex: ^4.3.3
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.2
  flutter_html: ^3.0.0
  flutter_local_notifications: ^18.0.1
  base_core:
  database:
  https:
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  injectable_generator: ^2.4.2
  floor_generator: ^1.5.0
  retrofit_generator: ^9.1.7
  build_runner: ^2.4.15
  stacked_generator: ^1.3.3
  json_serializable: ^6.8.0
  built_value_generator: ^8.9.3
  flutter_lints: ^5.0.0

# flutter_localizations pins intl 0.19.0; app requires 0.20.2 (DateFormat, l10n).
dependency_overrides:
  intl: 0.20.2

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Bold
      fonts:
        - weight: 700
        - asset: assets/fonts/PlusJakartaSans_Bold.ttf
    - family: SemiBold
      fonts:
        - weight: 600
        - asset: assets/fonts/PlusJakartaSans_SemiBold.ttf
    - family: Regular
      fonts:
        - weight: 400
        - asset: assets/fonts/PlusJakartaSans_Regular.ttf
    - family: Medium
      fonts:
        - weight: 500
        - asset: assets/fonts/PlusJakartaSans_Medium.ttf
    - family: Light
      fonts:
        - weight: 300
        - asset: assets/fonts/PlusJakartaSans_Light.ttf
    - family: DigitalNumbers
      fonts:
        - asset: assets/fonts/DigitalNumbers-Regular.ttf

  assets:
    # assets-generator-begin
    - assets/fonts/
    - assets/images/
    - assets/images/common/
    - assets/images/errors/
    - assets/images/flags/
    - assets/images/home/
    - assets/images/icons/
    - assets/images/kudos/
    - assets/images/login/
    - assets/images/secret_box/
    - assets/images/splash/
    # assets-generator-end

